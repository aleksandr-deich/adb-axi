name: Agent report
description: Share how your coding agent got on with adb-axi in a real session
title: "Agent report: "
labels: ["agent-report"]
body:
  - type: markdown
    attributes:
      value: |
        Most people arrive here with the fields already filled in by their agent's link. If you are filling this in by hand, ask your coding agent to run `adb-axi feedback` and follow what it prints: it lists what the report should cover, and once the report is written it prints a link that opens this form filled in.
  - type: input
    id: agent
    attributes:
      label: Agent and model
      description: Which coding agent and model ran the session.
      placeholder: e.g. Claude Code with Sonnet
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: adb-axi version
      description: Output of `adb-axi --version`
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Emulator
        - Physical phone
        - Both
    validations:
      required: false
  - type: textarea
    id: report
    attributes:
      label: Agent's report
      description: The report written by your agent. Check that it holds no private code, file paths or app names.
    validations:
      required: true
  - type: textarea
    id: opinion
    attributes:
      label: Your own take
      description: Did it save time? Would you keep using it? What would make you stop?
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked the report for private code, file paths, package names and device serials.
          required: true
